<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDUC_BABY // NOKIA_IMPACT_VOID</title>
    <style>
        :root {
            --primary: #00ff41;
            --bg: #000000;
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background: var(--bg);
            color: var(--primary);
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            display: flex; justify-content: center; align-items: center;
            perspective: 1200px;
        }

        canvas {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1;
        }

        .dither {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAQAAAAECAYAAACp8Z5+AAAAIklEQVQIW2NkQAKrVq36zwjjgzhh2uGAA5AemBEyEK4EBADfSzzS7YzUAAAAAElFTkSuQmCC');
            opacity: 0.12; pointer-events: none; z-index: 1000;
        }

        #scene {
            width: 85%; max-width: 500px;
            padding: 40px;
            border: 1px solid var(--primary);
            background: rgba(0, 0, 0, 0.95);
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
            box-shadow: 0 0 40px rgba(0, 255, 65, 0.1);
            position: relative;
        }

        .floating-hand {
            position: absolute; top: -55px; right: -15px;
            font-size: 3rem; filter: drop-shadow(0 0 10px var(--primary));
            animation: handFloat 4s ease-in-out infinite;
        }

        @keyframes handFloat {
            0%, 100% { transform: translateZ(120px) translateY(0); }
            50% { transform: translateZ(180px) translateY(-30px); }
        }

        h1 { letter-spacing: 12px; margin: 0; transform: translateZ(70px); }
        
        .module-item {
            display: flex; justify-content: space-between;
            padding: 20px; margin-top: 20px;
            border: 1px solid var(--primary);
            text-decoration: none; color: var(--primary);
            background: rgba(0, 255, 65, 0.05);
            transition: 0.3s;
            transform: translateZ(40px);
        }

        .module-item:hover {
            background: var(--primary); color: black;
            transform: translateZ(80px);
        }

        .locked { opacity: 0.2; pointer-events: none; border-style: dotted; }
    </style>
</head>
<body>

<canvas id="voidCanvas"></canvas>
<div class="dither"></div>

<div id="scene">
    <div class="floating-hand">☝️</div>
    <header>
        <h1>EDUC_BABY</h1>
        <p style="font-size: 0.7rem; opacity: 0.6;">> BATTLE_PROTOCOL_ACTIVE // STARFIELD_LOADED</p>
    </header>

    <div class="module-list">
        <a href="itil_exam.html" class="module-item">
            <span>[01] ITIL_4_FOUNDATION</span>
            <span>ENGAGE_</span>
        </a>
        <div class="module-item locked">
            <span>[02] CCNP_ENTERPRISE</span>
            <span>OFFLINE</span>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('voidCanvas');
    const ctx = canvas.getContext('2d');
    let ships = [], stars = [];
    let gridOffset = 0;

    const neonColors = ['#00ff41', '#ff00ff', '#00ffff', '#ffff00', '#ff0000'];

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        initStars();
    }

    function initStars() {
        stars = [];
        for(let i=0; i<150; i++) {
            stars.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, s: Math.random()*2 });
        }
    }

    class BattleShip {
        constructor() {
            this.reset();
        }
        reset() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            this.vx = (Math.random() - 0.5) * 5;
            this.vy = (Math.random() - 0.5) * 2;
            this.color = neonColors[Math.floor(Math.random() * neonColors.length)];
            this.timer = 0;
        }
        drawShip(x, y, color) {
            ctx.fillStyle = color;
            ctx.shadowBlur = 10;
            ctx.shadowColor = color;
            // Space Impact "Nokia" Pixel Shape (Simplified)
            const p = 3; 
            ctx.fillRect(x, y, p*4, p); // tail
            ctx.fillRect(x+p*2, y-p, p*3, p*3); // body
            ctx.fillRect(x+p*5, y, p*2, p); // nose
            ctx.shadowBlur = 0;
        }
        update() {
            this.x += this.vx;
            this.y += this.vy;
            if(this.timer++ % 40 === 0) { // Laser fire
                ctx.strokeStyle = this.color;
                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(this.x + this.vx*15, this.y + this.vy*15);
                ctx.stroke();
            }
            if(this.x < -50 || this.x > canvas.width + 50) this.reset();
        }
    }

    for(let i=0; i<20; i++) ships.push(new BattleShip());

    function drawGrid() {
        ctx.strokeStyle = 'rgba(0, 255, 65, 0.15)';
        ctx.lineWidth = 1;
        const spacing = 60;
        gridOffset = (gridOffset + 2) % spacing;

        // Draw horizontal lines (perspective feel)
        for(let i = -spacing; i < canvas.height; i += spacing) {
            ctx.beginPath();
            ctx.moveTo(0, i + gridOffset);
            ctx.lineTo(canvas.width, i + gridOffset);
            ctx.stroke();
        }
        // Vertical lines
        for(let i = 0; i < canvas.width; i += spacing) {
            ctx.beginPath();
            ctx.moveTo(i, 0);
            ctx.lineTo(i, canvas.height);
            ctx.stroke();
        }
    }

    function animate() {
        ctx.fillStyle = 'black';
        ctx.fillRect(0,0,canvas.width, canvas.height);
        
        // Stars
        ctx.fillStyle = 'white';
        stars.forEach(s => { ctx.fillRect(s.x, s.y, s.s, s.s); });

        drawGrid();
        ships.forEach(s => { s.update(); s.drawShip(s.x, s.y, s.color); });

        requestAnimationFrame(animate);
    }

    // Camera move
    const scene = document.getElementById('scene');
    document.addEventListener('mousemove', (e) => {
        const x = (window.innerWidth / 2 - e.pageX) / 40;
        const y = (window.innerHeight / 2 - e.pageY) / 40;
        scene.style.transform = `rotateY(${x}deg) rotateX(${-y}deg)`;
    });

    window.addEventListener('resize', resize);
    resize();
    animate();
</script>

</body>
</html>
