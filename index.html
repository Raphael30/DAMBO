<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDUC_BABY // ASTRO_MOTION</title>
    <style>
        :root {
            --primary: #00ff41;
            --bg: #050505;
        }

        body {
            background-color: var(--bg);
            color: var(--primary);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            height: 100vh;
            overflow: hidden; /* Keeps the "camera" contained */
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px; /* Essential for 3D tilt */
        }

        /* --- THE DITHER OVERLAY --- */
        .dither {
            position: fixed;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background-image: url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAQAAAAECAYAAACp8Z5+AAAAIklEQVQIW2NkQAKrVq36zwjjgzhh2uGAA5AemBEyEK4EBADfSzzS7YzUAAAAAElFTkSuQmCC');
            opacity: 0.15;
            pointer-events: none;
            z-index: 1000;
        }

        /* --- THE MOVING CAMERA CONTAINER --- */
        #scene {
            width: 90%;
            max-width: 700px;
            padding: 40px;
            border: 1px solid var(--primary);
            background: rgba(0, 255, 65, 0.02);
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
            position: relative;
        }

        /* --- FLOATING HAND ICON --- */
        .floating-hand {
            position: absolute;
            font-size: 2rem;
            top: -30px;
            right: -30px;
            animation: handFloat 4s ease-in-out infinite;
            filter: drop-shadow(0 0 5px var(--primary));
        }

        @keyframes handFloat {
            0%, 100% { transform: translateZ(50px) translateY(0) rotate(0deg); }
            50% { transform: translateZ(80px) translateY(-20px) rotate(10deg); }
        }

        header h1 {
            font-size: 2rem;
            letter-spacing: 8px;
            margin-bottom: 30px;
            transform: translateZ(40px); /* Pops the text out */
        }

        .module-list {
            list-style: none;
            padding: 0;
            transform: translateZ(20px);
        }

        .module-item {
            display: flex;
            justify-content: space-between;
            padding: 20px;
            margin-bottom: 10px;
            border: 1px solid var(--primary);
            text-decoration: none;
            color: var(--primary);
            transition: 0.3s;
        }

        .module-item:hover {
            background: var(--primary);
            color: black;
            transform: translateZ(30px); /* Lift on hover */
        }

        .module-item.locked {
            opacity: 0.3;
            border-style: dashed;
            cursor: not-allowed;
        }

        .cursor-follow {
            position: fixed;
            width: 20px;
            height: 20px;
            border: 1px solid var(--primary);
            pointer-events: none;
            z-index: 2000;
            transition: transform 0.05s linear;
        }

    </style>
</head>
<body>

<div class="dither"></div>
<div class="cursor-follow" id="cursor"></div>

<div id="scene">
    <div class="floating-hand">☝️</div>
    
    <header>
        <h1>EDUC_BABY</h1>
        <p>> CAMERA_LINK: ESTABLISHED</p>
    </header>

    <div class="module-list">
        <!-- Live Link -->
        <a href="itil_exam.html" class="module-item">
            <span>[01] ITIL_4_FOUNDATION</span>
            <span>READY_</span>
        </a>

        <!-- Coming Soon -->
        <div class="module-item locked">
            <span>[02] CCNP_ENTERPRISE</span>
            <span>COMING_SOON</span>
        </div>
    </div>
</div>

<script>
    const scene = document.getElementById('scene');
    const cursor = document.getElementById('cursor');

    // Camera Movement Logic
    document.addEventListener('mousemove', (e) => {
        // Calculate mouse position relative to center
        const xAxis = (window.innerWidth / 2 - e.pageX) / 25;
        const yAxis = (window.innerHeight / 2 - e.pageY) / 25;
        
        // Rotate the scene based on mouse
        scene.style.transform = `rotateY(${xAxis}deg) rotateX(${-yAxis}deg)`;

        // Custom Cursor movement
        cursor.style.left = e.pageX + 'px';
        cursor.style.top = e.pageY + 'px';
    });

    // Reset position when mouse leaves
    document.addEventListener('mouseleave', () => {
        scene.style.transform = `rotateY(0deg) rotateX(0deg)`;
    });
</script>

</body>
</html>
