<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Portal | Shine Bright</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }
        .hero-card {
            background: white;
            padding: 3rem;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 90%;
        }
        h1 {
            color: #2c3e50;
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }
        .motto {
            color: #3498db;
            font-weight: bold;
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 2rem;
        }
        .bank-list {
            text-align: left;
            background: #f9f9f9;
            padding: 1.5rem;
            border-radius: 8px;
            border-left: 5px solid #2ecc71;
            margin: 2rem 0;
        }
        .bank-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }
        .bank-item:last-child { border-bottom: none; }
        .btn-start {
            background-color: #3498db;
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 0.9rem;
            transition: 0.3s;
        }
        .btn-start:hover { background-color: #2980b9; transform: translateX(5px); }
        .coming-soon {
            font-style: italic;
            color: #7f8c8d;
            margin-top: 1rem;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="hero-card">
        <h1>ITS YOUR TIME TO SHINE!</h1>
        <div class="motto">STUDY HARD</div>
        
        <div class="bank-list">
            <h3 style="margin-top: 0; color: #2c3e50;">Question Banks Available:</h3>
            
            <div class="bank-item">
                <span><strong>ITIL 4 Foundation</strong> (80 Questions)</span>
                <a href="itil_exam.html" class="btn-start">Start Practice</a>
            </div>
        </div>

        <p class="coming-soon">🚀 More question banks to come soon!</p>
    </div>
</body>
</html>
