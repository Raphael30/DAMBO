<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDUC_BABY // BATTLE_VOID_V2</title>
    <style>
        :root {
            --primary: #00ff41;
            --bg: #000000;
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background: var(--bg);
            color: var(--primary);
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            display: flex; justify-content: center; align-items: center;
            perspective: 1000px;
        }

        canvas {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1;
        }

        .dither {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAQAAAAECAYAAACp8Z5+AAAAIklEQVQIW2NkQAKrVq36zwjjgzhh2uGAA5AemBEyEK4EBADfSzzS7YzUAAAAAElFTkSuQmCC');
            opacity: 0.15; pointer-events: none; z-index: 1000;
        }

        /* UI PANEL FIXED */
        #scene {
            width: 85%; max-width: 500px;
            padding: 40px;
            border: 1px solid var(--primary);
            background: rgba(0, 0, 0, 0.9);
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
            box-shadow: 0 0 40px rgba(0, 255, 65, 0.2);
            position: relative;
            z-index: 5;
        }

        .floating-hand {
            position: absolute; top: -60px; right: -10px;
            font-size: 3rem; filter: drop-shadow(0 0 10px var(--primary));
            animation: handFloat 4s ease-in-out infinite;
        }

        @keyframes handFloat {
            0%, 100% { transform: translateZ(120px) translateY(0); }
            50% { transform: translateZ(180px) translateY(-30px); }
        }

        h1 { letter-spacing: 12px; margin: 0; font-size: 2rem; transform: translateZ(60px); }
        
        .module-item {
            display: flex; justify-content: space-between;
            padding: 20px; margin-top: 20px;
            border: 1px solid var(--primary);
            text-decoration: none; color: var(--primary);
            background: rgba(0, 255, 65, 0.1);
            transition: 0.3s;
            transform: translateZ(30px);
        }

        .module-item:hover {
            background: var(--primary); color: black;
            transform: translateZ(70px);
        }

        .locked { opacity: 0.2; pointer-events: none; border-style: dotted; }
    </style>
</head>
<body>

<canvas id="voidCanvas"></canvas>
<div class="dither"></div>

<div id="scene">
    <div class="floating-hand">☝️</div>
    <header>
        <h1>EDUC_BABY</h1>
        <p style="font-size: 0.7rem; margin-top: 10px;">> CMD_CENTER: SECTOR_BATTLE_ACTIVE</p>
    </header>

    <div class="module-list">
        <a href="itil_exam.html" class="module-item">
            <span>[01] ITIL_4_FOUNDATION</span>
            <span>ENGAGE_</span>
        </a>
        <div class="module-item locked">
            <span>[02] CCNP_ENTERPRISE</span>
            <span>COMING_SOON</span>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('voidCanvas');
    const ctx = canvas.getContext('2d');
    let ships = [], stars = [], shootingStars = [];
    let gridOffset = 0;

    const neonColors = ['#00ff41', '#ff00ff', '#00ffff', '#ffff00', '#ff0000', '#ffffff'];

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        initStars();
    }

    /* --- STAR SYSTEM (Twinkling) --- */
    function initStars() {
        stars = [];
        for(let i=0; i<150; i++) {
            stars.push({
                x: Math.random()*canvas.width,
                y: Math.random()*canvas.height,
                size: Math.random()*1.5,
                opacity: Math.random(),
                speed: 0.01 + Math.random() * 0.02
            });
        }
    }

    function drawStars() {
        stars.forEach(s => {
            s.opacity += s.speed;
            if(s.opacity > 1 || s.opacity < 0) s.speed *= -1;
            ctx.fillStyle = `rgba(255, 255, 255, ${Math.abs(s.opacity)})`;
            ctx.fillRect(s.x, s.y, s.size, s.size);
        });

        // Chance to spawn a shooting star
        if(Math.random() < 0.02) {
            shootingStars.push({
                x: Math.random() * canvas.width,
                y: 0,
                vx: (Math.random() - 0.5) * 10,
                vy: Math.random() * 15 + 5,
                len: Math.random() * 30 + 20
            });
        }

        shootingStars.forEach((ss, index) => {
            ctx.strokeStyle = "rgba(255, 255, 255, 0.5)";
            ctx.beginPath();
            ctx.moveTo(ss.x, ss.y);
            ctx.lineTo(ss.x - ss.vx, ss.y - ss.vy);
            ctx.stroke();
            ss.x += ss.vx;
            ss.y += ss.vy;
            if(ss.y > canvas.height) shootingStars.splice(index, 1);
        });
    }

    /* --- AUTO-BATTLE SHIPS --- */
    class BattleShip {
        constructor() { this.reset(); }
        reset() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            this.vx = (Math.random() - 0.5) * 6;
            this.vy = (Math.random() - 0.5) * 2.5;
            this.color = neonColors[Math.floor(Math.random() * neonColors.length)];
            this.fireRate = Math.floor(Math.random() * 50) + 20;
            this.timer = 0;
        }
        drawShip() {
            ctx.fillStyle = this.color;
            ctx.shadowBlur = 15;
            ctx.shadowColor = this.color;
            const p = 3; 
            ctx.fillRect(this.x, this.y, p*4, p); // tail
            ctx.fillRect(this.x+p*2, this.y-p, p*3, p*3); // body
            ctx.fillRect(this.x+p*5, this.y, p*2, p); // nose
            ctx.shadowBlur = 0;
        }
        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.timer++;

            // AUTO FIRING LOGIC
            if(this.timer % this.fireRate === 0) {
                ctx.strokeStyle = this.color;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(this.x + 10, this.y);
                ctx.lineTo(this.x + this.vx * 30, this.y + this.vy * 30);
                ctx.stroke();
            }

            if(this.x < -100 || this.x > canvas.width + 100 || this.y < -100 || this.y > canvas.height + 100) this.reset();
        }
    }

    for(let i=0; i<15; i++) ships.push(new BattleShip());

    function drawGrid() {
        ctx.strokeStyle = 'rgba(0, 255, 65, 0.1)';
        ctx.lineWidth = 1;
        const spacing = 70;
        gridOffset = (gridOffset + 1.5) % spacing;

        for(let i = -spacing; i < canvas.height; i += spacing) {
            ctx.beginPath();
            ctx.moveTo(0, i + gridOffset);
            ctx.lineTo(canvas.width, i + gridOffset);
            ctx.stroke();
        }
        for(let i = 0; i < canvas.width; i += spacing) {
            ctx.beginPath();
            ctx.moveTo(i, 0);
            ctx.lineTo(i, canvas.height);
            ctx.stroke();
        }
    }

    function animate() {
        ctx.fillStyle = 'black';
        ctx.fillRect(0,0,canvas.width, canvas.height);
        
        drawStars();
        drawGrid();
        ships.forEach(s => { s.update(); s.drawShip(); });

        requestAnimationFrame(animate);
    }

    // Interactive Camera
    document.addEventListener('mousemove', (e) => {
        const x = (window.innerWidth / 2 - e.pageX) / 45;
        const y = (window.innerHeight / 2 - e.pageY) / 45;
        document.getElementById('scene').style.transform = `rotateY(${x}deg) rotateX(${-y}deg)`;
    });

    window.addEventListener('resize', resize);
    resize();
    animate();
</script>

</body>
</html>
