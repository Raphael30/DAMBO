<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITIL 4 - Space Impact Edition</title>
    <style>
        :root {
            --bg-color: #050a0f;
            --container-bg: rgba(15, 25, 35, 0.85);
            --text-color: #e0e6ed;
            --primary: #00d4ff;
            --success: #39ff14;
            --danger: #ff3131;
            --laser-color: #00f2ff;
        }

        body { 
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-color); 
            color: var(--text-color);
            margin: 0; display: flex; min-height: 100vh;
            overflow-x: hidden;
        }

        /* 3D PERSPECTIVE SIDEBAR */
        #sidebar { 
            position: sticky; top: 0; width: 300px; height: 100vh; 
            background: rgba(0, 0, 0, 0.9); padding: 20px;
            perspective: 1000px; /* Essential for 3D */
            border-right: 2px solid var(--primary);
            z-index: 10;
        }

        /* THE 3D NAV GRID */
        .nav-grid { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 10px; 
            transform: rotateY(15deg) rotateX(10deg); /* 3D Slant */
            transform-style: preserve-3d;
            margin-top: 20px;
        }

        .nav-item { 
            height: 50px; display: flex; align-items: center; justify-content: center;
            background: rgba(0, 212, 255, 0.1); 
            border: 1px solid var(--primary);
            color: var(--primary); font-weight: bold; cursor: pointer;
            transition: all 0.3s;
            transform: translateZ(0px);
        }

        .nav-item:hover {
            background: var(--primary);
            color: black;
            transform: translateZ(20px); /* Pops out toward user */
            box-shadow: 0 0 15px var(--primary);
        }

        /* LASER PROJECTILE */
        .laser-bolt {
            position: fixed;
            width: 30px; height: 4px;
            background: var(--laser-color);
            box-shadow: 0 0 10px var(--laser-color), 0 0 20px var(--laser-color);
            border-radius: 2px;
            z-index: 9999;
            pointer-events: none;
        }

        /* EXPLOSION EFFECT */
        @keyframes explode {
            0% { transform: scale(1); opacity: 1; box-shadow: 0 0 0px yellow; }
            50% { transform: scale(1.5); opacity: 1; box-shadow: 0 0 40px orange; background: white; }
            100% { transform: scale(2); opacity: 0; box-shadow: 0 0 80px red; }
        }

        .explosion {
            position: absolute; width: 100%; height: 100%;
            top: 0; left: 0;
            pointer-events: none;
            z-index: 5;
        }
        .exploding { animation: explode 0.5s ease-out forwards; }

        /* CONTENT STYLING */
        main { flex-grow: 1; padding: 40px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 800px; }
        
        .question-block { 
            position: relative;
            background: var(--container-bg); 
            margin-bottom: 50px; padding: 30px; 
            border-radius: 15px; border: 1px solid rgba(0, 212, 255, 0.2);
            transition: transform 0.3s;
        }

        .options li { 
            background: rgba(255,255,255,0.05); margin: 10px 0; padding: 15px; 
            border-radius: 8px; cursor: pointer; border: 1px solid transparent;
        }
        .options.locked li { pointer-events: none; opacity: 0.6; }
        .selected { border-color: var(--primary) !important; background: rgba(0, 212, 255, 0.1) !important; }
        .correct { border-color: var(--success) !important; color: var(--success); }
        .wrong { border-color: var(--danger) !important; color: var(--danger); }

        .btn-show { background: var(--primary); color: black; font-weight: bold; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

<aside id="sidebar">
    <h2 style="color: var(--primary); text-align: center;">CMD CENTER</h2>
    <div id="nav-grid" class="nav-grid"></div>
</aside>

<main>
    <div class="container" id="exam-content"></div>
</main>

<script>
    const questions = [
        { q: "What is the purpose of the 'Service Desk' practice?", a: ["To capture demand for incident resolution", "To set service levels", "To manage physical assets", "To design new services"], c: 0 },
        { q: "Which dimension includes 'Workflows'?", a: ["Organizations and People", "Information and Tech", "Partners and Suppliers", "Value Streams and Processes"], c: 3 }
    ];

    const content = document.getElementById('exam-content');
    const navGrid = document.getElementById('nav-grid');

    questions.forEach((item, i) => {
        // Create Question Block
        const block = document.createElement('div');
        block.className = 'question-block';
        block.id = `q-${i}`;
        block.innerHTML = `
            <h3>${i+1}. ${item.q}</h3>
            <ul class="options" id="opts-${i}">
                ${item.options ? "" : item.a.map((opt, idx) => `<li onclick="select(${i}, ${idx})">${opt}</li>`).join('')}
            </ul>
            <button class="btn-show" id="btn-${i}" onclick="toggleAnswer(${i})">Show Answer</button>
            <div class="explosion" id="exp-${i}"></div>
        `;
        content.appendChild(block);

        // Create 3D Nav Item
        const nav = document.createElement('div');
        nav.className = 'nav-item';
        nav.textContent = i + 1;
        nav.onclick = (e) => fireLaser(e, block, i);
        navGrid.appendChild(nav);
    });

    function select(qIdx, aIdx) {
        const ul = document.getElementById(`opts-${qIdx}`);
        if (ul.classList.contains('locked')) return;
        Array.from(ul.children).forEach(li => li.classList.remove('selected'));
        ul.children[aIdx].classList.add('selected');
    }

    function toggleAnswer(i) {
        const ul = document.getElementById(`opts-${i}`);
        const btn = document.getElementById(`btn-${i}`);
        const correctIdx = questions[i].c;

        if (ul.classList.contains('locked')) {
            ul.classList.remove('locked');
            Array.from(ul.children).forEach(li => li.classList.remove('correct', 'wrong'));
            btn.textContent = "Show Answer";
        } else {
            ul.classList.add('locked');
            ul.children[correctIdx].classList.add('correct');
            btn.textContent = "Hide Answer";
        }
    }

    function fireLaser(e, targetBlock, i) {
        const startX = e.clientX;
        const startY = e.clientY;
        const rect = targetBlock.getBoundingClientRect();
        const endX = rect.left + (rect.width / 2);
        const endY = rect.top + (rect.height / 2);

        // Create Projectile
        const laser = document.createElement('div');
        laser.className = 'laser-bolt';
        document.body.appendChild(laser);

        const angle = Math.atan2(endY - startY, endX - startX);
        laser.style.left = `${startX}px`;
        laser.style.top = `${startY}px`;
        laser.style.transform = `rotate(${angle}rad)`;

        // Animate Laser
        const animation = laser.animate([
            { left: `${startX}px`, top: `${startY}px`, opacity: 1 },
            { left: `${endX}px`, top: `${endY}px`, opacity: 1 }
        ], { duration: 400, easing: 'linear' });

        animation.onfinish = () => {
            laser.remove();
            targetBlock.scrollIntoView({ behavior: 'smooth', block: 'center' });
            
            // Trigger Explosion
            const exp = document.getElementById(`exp-${i}`);
            exp.classList.add('exploding');
            setTimeout(() => exp.classList.remove('exploding'), 500);
        };
    }
</script>
</body>
</html>
