<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDUC BABY - Road to Knowledge Adventure!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial Black', Arial, sans-serif;
            overflow-x: hidden;
            background: linear-gradient(45deg, #ff6b35, #f7931e, #ffd23f, #ff6b35);
            background-size: 400% 400%;
            animation: gradientShift 8s ease infinite;
            min-height: 100vh;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .road-container {
            position: relative;
            height: 100vh;
            overflow: hidden;
        }

        .road {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 200px;
            background: repeating-linear-gradient(
                0deg,
                #333 0px,
                #333 40px,
                #fff 40px,
                #fff 80px
            );
            animation: roadMove 20s linear infinite;
        }

        @keyframes roadMove {
            0% { transform: translateX(0); }
            100% { transform: translateX(-200px); }
        }

        .van {
            position: absolute;
            bottom: 220px;
            left: 50%;
            transform: translateX(-50%);
            width: 300px;
            height: 180px;
            background: linear-gradient(45deg, #00aaff, #0088cc);
            border-radius: 20px;
            animation: vanBounce 3s ease-in-out infinite, vanDrive 60s linear infinite;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        @keyframes vanBounce {
            0%, 100% { transform: translateX(-50%) translateY(0px) rotate(-1deg); }
            50% { transform: translateX(-50%) translateY(-10px) rotate(1deg); }
        }

        @keyframes vanDrive {
            0% { left: -20%; }
            100% { left: 120%; }
        }

        .van::before {
            content: '';
            position: absolute;
            top: 20px;
            left: 20px;
            width: 60px;
            height: 40px;
            background: #333;
            border-radius: 10px 10px 0 0;
        }

        .van::after {
            content: 'EDUC';
            position: absolute;
            top: 50px;
            left: 90px;
            font-size: 24px;
            font-weight: bold;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .headlights {
            position: absolute;
            bottom: 20px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 40px;
        }

        .headlight {
            width: 30px;
            height: 30px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 30px #fff, 0 0 60px #fff;
            animation: headlightGlow 2s ease-in-out infinite alternate;
        }

        @keyframes headlightGlow {
            0% { opacity: 0.7; transform: scale(1); }
            100% { opacity: 1; transform: scale(1.2); }
        }

        .content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            z-index: 100;
            animation: slideInUp 1.5s ease-out;
        }

        @keyframes slideInUp {
            0% { opacity: 0; transform: translate(-50%, 100px); }
            100% { opacity: 1; transform: translate(-50%, -50%); }
        }

        h1 {
            font-size: 4rem;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.5);
            margin-bottom: 20px;
            animation: titlePulse 2s ease-in-out infinite;
            letter-spacing: 5px;
        }

        @keyframes titlePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .subtitle {
            font-size: 1.5rem;
            margin-bottom: 30px;
            opacity: 0.9;
            animation: fadeIn 2s ease-in 0.5s both;
        }

        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 0.9; transform: translateY(0); }
        }

        .cta-button {
            display: inline-block;
            padding: 20px 50px;
            font-size: 1.5rem;
            font-weight: bold;
            background: linear-gradient(45deg, #ff4757, #ff3838);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            box-shadow: 0 10px 30px rgba(255,71,87,0.4);
            animation: buttonBounce 2s infinite, glow 2s infinite alternate;
            transition: all 0.3s ease;
        }

        .cta-button:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 15px 40px rgba(255,71,87,0.6);
        }

        @keyframes buttonBounce {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        @keyframes glow {
            0% { box-shadow: 0 10px 30px rgba(255,71,87,0.4); }
            100% { box-shadow: 0 10px 30px rgba(255,71,87,0.7); }
        }

        .features {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 30px;
        }

        .feature {
            background: rgba(255,255,255,0.2);
            padding: 15px 25px;
            border-radius: 25px;
            backdrop-filter: blur(10px);
            animation: float 3s ease-in-out infinite;
        }

        .feature:nth-child(2) { animation-delay: 1s; }
        .feature:nth-child(3) { animation-delay: 2s; }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        @media (max-width: 768px) {
            h1 { font-size: 2.5rem; }
            .van { width: 250px; height: 150px; }
            .features { flex-direction: column; align-items: center; gap: 15px; }
        }

        .stars {
            position: absolute;
            top: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .star {
            position: absolute;
            width: 4px;
            height: 4px;
            background: white;
            border-radius: 50%;
            animation: twinkle 2s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0; transform: scale(0); }
            50% { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="road-container">
        <div class="stars" id="stars"></div>
        
        <div class="road"></div>
        
        <div class="van">
            <div class="headlights">
                <div class="headlight"></div>
                <div class="headlight"></div>
            </div>
        </div>

        <div class="content">
            <h1>🚍 EDUC BABY</h1>
            <p class="subtitle">Hop on board for your KNOWLEDGE adventure!</p>
            <a href="#start-learning" class="cta-button">START YOUR JOURNEY ➡️</a>
        </div>

        <div class="features">
            <div class="feature">📚 Interactive Lessons</div>
            <div class="feature">🎮 Gamified Learning</div>
            <div class="feature">🚀 Progress Tracking</div>
        </div>
    </div>

    <script>
        // Create twinkling stars
        function createStars() {
            const starsContainer = document.getElementById('stars');
            for (let i = 0; i < 50; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 50 + '%';
                star.style.animationDelay = Math.random() * 2 + 's';
                star.style.animationDuration = (Math.random() * 3 + 1) + 's';
                starsContainer.appendChild(star);
            }
        }

        // Restart van animation when it goes off screen
        const van = document.querySelector('.van');
        van.addEventListener('animationiteration', function(e) {
            if (e.animationName === 'vanDrive') {
                van.style.animation = 'none';
                van.offsetHeight; // trigger reflow
                van.style.animation = 'vanBounce 3s ease-in-out infinite, vanDrive 60s linear infinite';
            }
        });

        // Initialize
        createStars();

        // Smooth scroll for CTA
        document.querySelector('.cta-button').addEventListener('click', function(e) {
            e.preventDefault();
            document.querySelector('.cta-button').style.animation = 'none';
            setTimeout(() => {
                document.querySelector('.cta-button').style.animation = 'buttonBounce 2s infinite, glow 2s infinite alternate';
            }, 100);
        });
    </script>
</body>
</html>
