<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDUC_BABY // DITHER_LINK_SYSTEM</title>
    <style>
        :root {
            --primary: #00ff41; 
            --bg: #050505;
            --dither-opacity: 0.12;
        }

        body {
            background-color: var(--bg);
            color: var(--primary);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* --- THE DITHER & CRT OVERLAY --- */
        .dither-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAQAAAAECAYAAACp8Z5+AAAAIklEQVQIW2NkQAKrVq36zwjjgzhh2uGAA5AemBEyEK4EBADfSzzS7YzUAAAAAElFTkSuQmCC');
            opacity: var(--dither-opacity);
            pointer-events: none;
            z-index: 100;
        }

        header {
            margin-top: 60px;
            text-align: center;
            border: 1px solid var(--primary);
            padding: 25px;
            width: 85%;
            max-width: 650px;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.2);
        }

        .status-header {
            font-size: 0.9rem;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        /* --- QUESTION BANK LIST --- */
        .module-list {
            width: 85%;
            max-width: 650px;
            margin-top: 40px;
        }

        .module-item {
            display: flex;
            justify-content: space-between;
            padding: 15px;
            border: 1px solid transparent;
            text-decoration: none;
            color: var(--primary);
            margin-bottom: 10px;
            transition: 0.2s;
            background: rgba(0, 255, 65, 0.03);
        }

        /* Active Link Styling */
        .module-item.active:hover {
            background: var(--primary);
            color: black;
            border: 1px solid var(--primary);
        }

        /* Coming Soon Styling */
        .module-item.pending {
            opacity: 0.4;
            cursor: not-allowed;
            border: 1px dashed var(--primary);
        }

        .tag { font-weight: bold; }

        footer {
            margin-top: auto;
            padding: 30px;
            font-size: 0.7rem;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

<div class="dither-overlay"></div>

<header>
    <div class="status-header">SYSTEM_STATUS: ONLINE</div>
    <h1 style="margin:0; letter-spacing: 5px;">EDUC_BABY.CORE</h1>
    <p>> SELECT_MODULE_TO_INITIALIZE...</p>
</header>

<div class="module-list">
    <!-- Active Bank -->
    <a href="itil_exam.html" class="module-item active">
        <span>01. ITIL_4_FOUNDATION_EXAM</span>
        <span class="tag">[ ACCESS_GRANTED ]</span>
    </a>

    <!-- Coming Soon Bank -->
    <div class="module-item pending">
        <span>02. CCNP_ENTERPRISE_ENCOR</span>
        <span class="tag">[ COMING_SOON ]</span>
    </div>
</div>

<footer>
    ESTABLISHED_2024 // NO_AUDIO_DETECTED // DATA_STREAM_STABLE
</footer>

</body>
</html>
