<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDUC_BABY // BATTLE_VOID</title>
    <style>
        :root {
            --primary: #00ff41;
            --bg: #000000;
            --grid-size: 80px;
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: var(--bg);
            color: var(--primary);
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            display: flex; justify-content: center; align-items: center;
            perspective: 1000px;
        }

        /* --- BACKGROUND LAYERS --- */
        #battleCanvas {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -2;
        }

        .void-floor {
            position: fixed; bottom: -20%; left: -50%;
            width: 200%; height: 100%;
            background-image: 
                linear-gradient(to right, rgba(0, 255, 65, 0.15) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 255, 65, 0.15) 1px, transparent 1px);
            background-size: var(--grid-size) var(--grid-size);
            transform: rotateX(75deg);
            z-index: -1;
            animation: gridScroll 2s linear infinite;
        }

        @keyframes gridScroll {
            from { background-position: 0 0; }
            to { background-position: 0 var(--grid-size); }
        }

        .dither {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAQAAAAECAYAAACp8Z5+AAAAIklEQVQIW2NkQAKrVq36zwjjgzhh2uGAA5AemBEyEK4EBADfSzzS7YzUAAAAAElFTkSuQmCC');
            opacity: 0.1; pointer-events: none; z-index: 1000;
        }

        /* --- UI PANEL --- */
        #scene {
            width: 85%; max-width: 550px;
            padding: 40px;
            border: 1px solid var(--primary);
            background: rgba(0, 0, 0, 0.9);
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
            box-shadow: 0 0 50px rgba(0, 255, 65, 0.1);
        }

        .floating-hand {
            position: absolute; top: -50px; right: -20px;
            font-size: 2.5rem; filter: drop-shadow(0 0 10px var(--primary));
            animation: handFloat 3s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes handFloat {
            0%, 100% { transform: translateZ(100px) translateY(0); }
            50% { transform: translateZ(150px) translateY(-20px); }
        }

        h1 { letter-spacing: 10px; transform: translateZ(60px); }

        .module-item {
            display: flex; justify-content: space-between;
            padding: 15px; margin-top: 15px;
            border: 1px solid var(--primary);
            text-decoration: none; color: var(--primary);
            background: rgba(0, 255, 65, 0.05);
            transition: 0.3s;
            transform: translateZ(30px);
        }

        .module-item:hover {
            background: var(--primary); color: black;
            transform: translateZ(60px);
        }

        .locked { opacity: 0.2; pointer-events: none; border-style: dotted; }
    </style>
</head>
<body>

<canvas id="battleCanvas"></canvas>
<div class="void-floor"></div>
<div class="dither"></div>

<div id="scene">
    <div class="floating-hand">☝️</div>
    <header>
        <h1>EDUC_BABY</h1>
        <p style="font-size: 0.7rem;">> SECTOR_4_BATTLE_ENGAGED...</p>
    </header>

    <div class="module-list">
        <a href="itil_exam.html" class="module-item">
            <span>[01] ITIL_4_FOUNDATION</span>
            <span>ENTER_LINK</span>
        </a>
        <div class="module-item locked">
            <span>[02] CCNP_ENTERPRISE</span>
            <span>LOCKED</span>
        </div>
    </div>
</div>

<script>
    /* --- BATTLE SYSTEM --- */
    const canvas = document.getElementById('battleCanvas');
    const ctx = canvas.getContext('2d');
    let ships = [];

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    class Ship {
        constructor() {
            this.reset();
        }
        reset() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            this.vx = (Math.random() - 0.5) * 4;
            this.vy = (Math.random() - 0.5) * 2;
            this.size = 2;
            this.timer = 0;
        }
        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.timer++;

            // Shooting effect
            if (this.timer % 30 === 0) {
                ctx.beginPath();
                ctx.strokeStyle = Math.random() > 0.5 ? '#00ff41' : '#ff0000';
                ctx.lineWidth = 1;
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(this.x + (this.vx * 20), this.y + (this.vy * 20));
                ctx.stroke();
            }

            if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
                this.reset();
            }
        }
        draw() {
            ctx.fillStyle = '#00ff41';
            ctx.fillRect(this.x, this.y, this.size, this.size);
        }
    }

    for(let i=0; i<100; i++) ships.push(new Ship());

    function animate() {
        ctx.fillStyle = 'rgba(0,0,0,0.15)'; // Trail effect
        ctx.fillRect(0,0,canvas.width, canvas.height);
        ships.forEach(s => { s.update(); s.draw(); });
        requestAnimationFrame(animate);
    }
    animate();

    /* --- CAMERA MOVEMENT --- */
    const scene = document.getElementById('scene');
    document.addEventListener('mousemove', (e) => {
        const x = (window.innerWidth / 2 - e.pageX) / 40;
        const y = (window.innerHeight / 2 - e.pageY) / 40;
        scene.style.transform = `rotateY(${x}deg) rotateX(${-y}deg)`;
    });
</script>

</body>
</html>
