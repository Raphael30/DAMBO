<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDUC_BABY // VOID_RUNNER</title>
    <style>
        :root {
            --primary: #00ff41;
            --bg: #000000;
            --grid-size: 100px;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg);
            color: var(--primary);
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1200px;
        }

        /* --- THE VOID PLANE --- */
        .void-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            perspective: 500px;
            z-index: -1;
            background: radial-gradient(circle at center, #001a00 0%, #000 70%);
        }

        .grid-plane {
            position: absolute;
            width: 400%;
            height: 400%;
            top: -50%;
            left: -150%;
            background-image: 
                linear-gradient(to right, rgba(0, 255, 65, 0.2) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 255, 65, 0.2) 1px, transparent 1px);
            background-size: var(--grid-size) var(--grid-size);
            transform: rotateX(60deg);
            animation: flyForward 4s linear infinite;
        }

        @keyframes flyForward {
            from { transform: rotateX(60deg) translateY(0); }
            to { transform: rotateX(60deg) translateY(var(--grid-size)); }
        }

        /* --- DITHER LAYER --- */
        .dither {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAQAAAAECAYAAACp8Z5+AAAAIklEQVQIW2NkQAKrVq36zwjjgzhh2uGAA5AemBEyEK4EBADfSzzS7YzUAAAAAElFTkSuQmCC');
            opacity: 0.15;
            pointer-events: none;
            z-index: 1000;
        }

        /* --- UI INTERFACE --- */
        #scene {
            width: 80%;
            max-width: 600px;
            padding: 40px;
            border: 1px solid var(--primary);
            background: rgba(0, 0, 0, 0.9);
            transform-style: preserve-3d;
            transition: transform 0.2s ease-out;
            position: relative;
            box-shadow: 0 0 40px rgba(0, 255, 65, 0.15);
        }

        .floating-hand {
            position: absolute;
            font-size: 3rem;
            top: -60px;
            right: -20px;
            animation: handFloat 4s ease-in-out infinite;
            filter: drop-shadow(0 0 10px var(--primary));
            user-select: none;
            pointer-events: none;
        }

        @keyframes handFloat {
            0%, 100% { transform: translateZ(80px) translateY(0) rotate(-10deg); }
            50% { transform: translateZ(120px) translateY(-25px) rotate(10deg); }
        }

        header h1 {
            font-size: 2.5rem;
            letter-spacing: 12px;
            margin: 0;
            transform: translateZ(60px);
        }

        .status {
            font-size: 0.7rem;
            margin-bottom: 40px;
            transform: translateZ(40px);
            opacity: 0.7;
        }

        .module-list {
            padding: 0;
            transform: translateZ(30px);
        }

        .module-item {
            display: flex;
            justify-content: space-between;
            padding: 20px;
            margin-bottom: 12px;
            border: 1px solid var(--primary);
            text-decoration: none;
            color: var(--primary);
            transition: 0.3s;
            background: rgba(0, 255, 65, 0.05);
        }

        .module-item:hover {
            background: var(--primary);
            color: #000;
            transform: translateZ(50px);
        }

        .locked {
            opacity: 0.2;
            border-style: dotted;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="void-container">
    <div class="grid-plane"></div>
</div>

<div class="dither"></div>

<div id="scene">
    <div class="floating-hand">☝️</div>
    
    <header>
        <h1>EDUC_BABY</h1>
        <div class="status">> INITIALIZING_HYPERSPACE_PROJECTION...</div>
    </header>

    <div class="module-list">
        <a href="itil_exam.html" class="module-item">
            <span>[01] ITIL_4_FOUNDATION</span>
            <span>ENTER_VOID</span>
        </a>

        <div class="module-item locked">
            <span>[02] CCNP_ENTERPRISE</span>
            <span>DATA_LOCKED</span>
        </div>
    </div>
</div>

<script>
    const scene = document.getElementById('scene');
    
    // Smooth 3D Camera Follow
    document.addEventListener('mousemove', (e) => {
        const x = (window.innerWidth / 2 - e.pageX) / 35;
        const y = (window.innerHeight / 2 - e.pageY) / 35;
        scene.style.transform = `rotateY(${x}deg) rotateX(${-y}deg)`;
    });

    // Reset on exit
    document.addEventListener('mouseleave', () => {
        scene.style.transform = `rotateY(0deg) rotateX(0deg)`;
    });
</script>

</body>
</html>
