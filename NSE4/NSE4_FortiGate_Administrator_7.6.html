    let examQuestions = [];
    let currentIdx = 0;
    let userSelections = {}; 

    function initializeQuizEngine() {
        currentIdx = 0;
        userSelections = {};
        
        examQuestions = originalQuestions.map(q => {
            // Mapping system automatically anchors letters A, B, C, D to options before scrambling order
            const mappedOptions = q.options.map((text, i) => {
                const letter = String.fromCharCode(65 + i); // 65 is ASCII for 'A'
                return { key: letter, text: text };
            });

            // Scramble option orders safely
            for (let i = mappedOptions.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [mappedOptions[i], mappedOptions[j]] = [mappedOptions[j], mappedOptions[i]];
            }
            return {
                ...q,
                options: mappedOptions
            };
        });

        buildNavigationGrid();
        renderQuestion();
    }

    function buildNavigationGrid() {
        const container = document.getElementById('grid-container');
        container.innerHTML = '';
        examQuestions.forEach((q, idx) => {
            const btn = document.createElement('div');
            btn.id = `grid-btn-${idx}`;
            btn.className = 'grid-btn';
            btn.innerText = idx + 1;
            btn.onclick = () => jumpToQuestion(idx);
            container.appendChild(btn);
        });
    }

    function jumpToQuestion(idx) {
        currentIdx = idx;
        renderQuestion();
    }

    function updateNavigationGridStyles() {
        examQuestions.forEach((_, idx) => {
            const btn = document.getElementById(`grid-btn-${idx}`);
            if(!btn) return;

            btn.classList.remove('active', 'answered');

            const savedSelections = userSelections[idx] || [];
            if (savedSelections.length > 0) {
                btn.classList.add('answered');
            }
            if (idx === currentIdx) {
                btn.classList.add('active');
            }
        });
    }

    function renderQuestion() {
        const qData = examQuestions[currentIdx];
        const isMulti = qData.answer.length > 1;
        
        const progressPercent = ((currentIdx + 1) / examQuestions.length) * 100;
        document.getElementById('progress').style.width = `${progressPercent}%`;

        let html = `
            <div class="question-card">
                <div class="question-text">Question ${currentIdx + 1} of ${examQuestions.length}:<br><br>${qData.question}</div>
        `;

        if (qData.image) {
            html += `<div class="exhibit-gallery">`;
            if (Array.isArray(qData.image)) {
                qData.image.forEach(imgSrc => {
                    html += `<img src="${imgSrc}" alt="Exhibit View" class="exhibit-image" onerror="this.style.display='none';">`;
                });
            } else if (typeof qData.image === 'string') {
                html += `<img src="${qData.image}" alt="Exhibit View" class="exhibit-image" onerror="this.style.display='none';">`;
            }
            html += `</div>`;
        }

        html += `<div class="options-container">`;
        
        // Dynamically print standard prefix formatting tags based on current render position index (A, B, C...)
        qData.options.forEach((opt, index) => {
            const currentPrefix = String.fromCharCode(65 + index); 
            const trackingKey = opt.key; // Under-the-hood tracking identifier
            
            const savedArr = userSelections[currentIdx] || [];
            const isChecked = savedArr.includes(trackingKey) ? 'checked' : '';
            const selectedClass = savedArr.includes(trackingKey) ? 'selected' : '';
            const inputType = isMulti ? 'checkbox' : 'radio';

            html += `
                <label class="option-label ${selectedClass}" id="lbl-${trackingKey}">
                    <input type="${inputType}" name="q-opt" value="${trackingKey}" ${isChecked} onchange="handleSelection(this)">
                    <strong>${currentPrefix}.</strong> &nbsp; ${opt.text}
                </label>
            `;
        });
        html += `</div></div>`;

        document.getElementById('question-container').innerHTML = html;

        document.getElementById('btn-prev').disabled = currentIdx === 0;
        document.getElementById('btn-next').disabled = currentIdx === examQuestions.length - 1;

        updateNavigationGridStyles();
    }

    function handleSelection(input) {
        const trackingKey = input.value;
        const isMulti = examQuestions[currentIdx].answer.length > 1;

        if (!userSelections[currentIdx]) {
            userSelections[currentIdx] = [];
        }

        if (isMulti) {
            if (input.checked) {
                if (!userSelections[currentIdx].includes(trackingKey)) userSelections[currentIdx].push(trackingKey);
            } else {
                userSelections[currentIdx] = userSelections[currentIdx].filter(l => l !== trackingKey);
            }
        } else {
            userSelections[currentIdx] = [trackingKey];
        }
        
        examQuestions[currentIdx].options.forEach(opt => {
            const tk = opt.key;
            const lbl = document.getElementById(`lbl-${tk}`);
            if (userSelections[currentIdx].includes(tk)) {
                lbl.classList.add('selected');
            } else {
                lbl.classList.remove('selected');
            }
        });

        updateNavigationGridStyles();
    }

    function changeQuestion(dir) {
        currentIdx += dir;
        if(currentIdx >= 0 && currentIdx < examQuestions.length) {
            renderQuestion();
        }
    }

    function showResults() {
        document.getElementById('quiz-wrapper').style.display = 'none';
        document.getElementById('sidebar-panel').style.display = 'none';
        
        document.querySelector('.main-layout').style.display = 'block';
        document.getElementById('quiz-area').style.maxWidth = '850px';

        const resultsDiv = document.getElementById('results-container');
        resultsDiv.style.display = 'block';

        let correctCount = 0;
        let reviewHtml = `<h2>Exam Review Summary</h2>`;

        examQuestions.forEach((qData, idx) => {
            const userAnswers = userSelections[idx] || [];
            const sortedUserArr = [...userAnswers].sort().join('');
            const sortedTargetArr = qData.answer.split('').sort().join('');
            
            const isCorrect = sortedUserArr === sortedTargetArr;
            if (isCorrect) correctCount++;

            let originalOptMapping = {};
            qData.options.forEach(o => { originalOptMapping[o.key] = o.text; });

            const userAnswersFormatted = userAnswers.map(k => `${k}. ${originalOptMapping[k]}`).join('<br>');
            const correctAnswersFormatted = qData.answer.split('').map(k => `${k}. ${originalOptMapping[k]}`).join('<br>');

            reviewHtml += `
                <div class="review-item">
                    <span class="status-badge ${isCorrect ? 'correct' : 'incorrect'}">
                        ${isCorrect ? 'Correct' : 'Incorrect'}
                    </span>
                    <div style="font-weight:bold; margin-bottom:12px;">Question ${idx + 1}: ${qData.question}</div>
                    <div style="margin-bottom: 8px;"><strong>Your Selection:</strong><br><span style="color:#555;">${userAnswersFormatted || 'None'}</span></div>
                    <div><strong>Correct Answer Blueprint:</strong><br><span style="color:#222;">${correctAnswersFormatted}</span></div>
                </div>
            `;
        });

        const finalScorePercent = ((correctCount / examQuestions.length) * 100).toFixed(1);
        
        let headerHtml = `
            <div class="results-screen">
                <h2>Quiz Evaluation Finished</h2>
                <div class="score-display">${correctCount} / ${examQuestions.length}</div>
                <p>Overall Accuracy Rating: <strong>${finalScorePercent}%</strong></p>
                <button class="btn-nav" onclick="initializeQuizEngine(); document.getElementById('results-container').style.display='none'; document.getElementById('quiz-wrapper').style.display='block'; document.getElementById('sidebar-panel').style.display='flex'; document.querySelector('.main-layout').style.display='grid';" style="margin-bottom:30px;">Restart Engine (Reshuffle)</button>
            </div>
        `;

        resultsDiv.innerHTML = headerHtml + reviewHtml;
    }

    initializeQuizEngine();
</script>
</body>
</html>
