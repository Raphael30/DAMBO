<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITIL 4 Foundation Simulator</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --container-bg: #ffffff;
            --text-color: #333333;
            --border-color: #dddddd;
            --sidebar-bg: #2c3e50;
            --sidebar-text: #ffffff;
            --block-border: #eeeeee;
            --option-hover: #f0f7ff;
            --nav-bg: #ffffff;
            --primary: #3498db;
            --success: #2ecc71;
            --danger: #e74c3c;
            --warning: #e67e22;
            --flagged: #f1c40f;
            
            /* User requested custom colors */
            --btn-reveal-bg: #e8f8f1; /* Light green */
            --btn-flag-bg: #fff8e1;   /* Yellow-orange light */
            --action-text: #333333;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--bg-color); 
            margin: 0; 
            display: flex;
            min-height: 100vh;
        }

        #sidebar { 
            position: sticky; top: 0; width: 260px; height: 100vh; 
            background: var(--sidebar-bg); padding: 20px; box-sizing: border-box;
            display: flex; flex-direction: column; gap: 15px; z-index: 100;
        }

        main { flex-grow: 1; display: flex; justify-content: center; padding: 20px; }

        .container { 
            width: 100%; max-width: 850px; background: var(--container-bg); 
            padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); 
            box-sizing: border-box;
        }

        h1 { text-align: center; color: var(--primary); border-bottom: 2px solid var(--primary); padding-bottom: 15px; }
        .question-block { margin-bottom: 30px; padding: 25px; border-bottom: 1px solid var(--block-border); scroll-margin-top: 20px; }
        
        .question-actions { display: flex; gap: 10px; margin-top: 20px; align-items: center; }

        .btn-small {
            padding: 6px 12px; font-size: 12px; cursor: pointer;
            border: 1px solid var(--border-color); border-radius: 4px;
            font-weight: bold; transition: 0.2s; color: var(--action-text);
        }

        .btn-reveal-styled { background-color: var(--btn-reveal-bg); }
        .flag-btn-styled { background-color: var(--btn-flag-bg); }
        .flag-btn-styled.active { background-color: var(--flagged); border-color: var(--flagged); }

        .options { list-style: none; padding: 0; margin-top: 15px; }
        .options li { 
            margin: 10px 0; padding: 15px; border: 1px solid var(--border-color); 
            border-radius: 6px; cursor: pointer; transition: 0.2s; background: var(--container-bg); 
        }
        .options li:hover { background-color: var(--option-hover); }
        .options li.selected { border-color: var(--primary); border-width: 2px; background-color: #3498db22; }
        
        .correct { background-color: #2ecc7133 !important; color: var(--success) !important; border-color: var(--success) !important; font-weight: bold; }
        .wrong { background-color: #e74c3c33 !important; color: var(--danger) !important; border-color: var(--danger) !important; }

        #nav-panel { background: var(--nav-bg); border-radius: 8px; padding: 12px; overflow-y: auto; flex-grow: 1; }
        .nav-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(38px, 1fr)); gap: 6px; }
        .nav-item { 
            padding: 10px 0; text-align: center; border: 1px solid var(--border-color); 
            border-radius: 4px; cursor: pointer; font-size: 12px; background: var(--container-bg); 
            color: var(--text-color); font-weight: bold; position: relative;
        }
        .nav-item.flagged-nav::after {
            content: ""; position: absolute; top: 2px; right: 2px;
            width: 8px; height: 8px; background-color: var(--flagged); border-radius: 50%;
        }
        .nav-answered { border-color: var(--primary); background: #3498db22; }
        .nav-correct { background-color: var(--success) !important; color: white !important; }
        .nav-wrong { background-color: var(--danger) !important; color: white !important; }

        .action-btn { padding: 12px; font-size: 14px; cursor: pointer; border: none; border-radius: 8px; font-weight: bold; width: 100%; }
        .btn-end { background-color: var(--success); color: white; }
    </style>
</head>
<body>

<aside id="sidebar">
    <div style="text-align: center; color: white; padding-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.1);">
        <div id="time-part" style="font-size: 1.6rem; color: #3498db; font-weight: bold; margin-bottom: 5px;"></div>
        <a href="index.html" style="color: #ecf0f1; text-decoration: none; font-size: 11px; opacity: 0.8;">← Return to Portal</a>
    </div>
    <div id="nav-panel">
        <div class="nav-grid" id="nav-grid"></div>
    </div>
    <button id="btn-end-exam" class="action-btn btn-end">End Exam</button>
</aside>

<main>
    <div class="container">
        <h1 id="exam-title">ITIL 4 Foundation Simulator</h1>
        <div id="exam-content"></div>
    </div>
</main>

<script>
(function() {
    "use strict";

    const questions = [
        { q: "Which concept is illustrated when an employee is granted permission to the company’s new file-sharing platform for daily use?", a: ["Warranty", "Goods", "Utility", "Access to resources"], c: 3 },
        { q: "An IT support engineer assisting a user in configuring their laptop is an example of which concept?", a: ["Transfer of goods", "Service actions", "Sustainability", "Access to resources"], c: 1 },
        { q: "What influences whether a service is perceived as valuable by a consumer?", a: ["The service provider’s ability to minimize their operational costs", "The number of providers delivering the service to the consumer", "The extent to which the positive effects of the service outweigh the negative ones", "The amount of money the service provider invests in resources"], c: 2 },
        { q: "Which of the following is TRUE regarding services and desired outcomes?", a: ["Services guarantee that all intended outcomes will be achieved", "Services completely eliminate risks associated with achieving outcomes", "Services always result in positive effects without exceptions", "Services may have unintended and surprising outcomes, both positive and negative"], c: 3 },
        { q: "A service provider commits to using recyclable components, reducing carbon emissions, and maintaining transparent supply chains. Which concept does this commitment represent?", a: ["Utility", "Warranty", "User experience", "Sustainability"], c: 3 },
        { q: "Which dimension of product and service management is directly influenced by leadership commitment to psychological safety and continual learning?", a: ["Partners and suppliers", "Value streams and processes", "Information and technology", "Organizations and people"], c: 3 },
        { q: "Which of the following dimension of product and service management addresses organizational and cross-organizational workflows?", a: ["Partners and suppliers", "Information and technology", "Organizations and people", "Value streams and processes"], c: 3 },
        { q: "Which dimension of product and service management addresses data and technologies used in digital product and services?", a: ["Partners and suppliers", "Value streams and processes", "Organizations and people", "Information and technology"], c: 3 },
        { q: "Which dimension of product and service management is concerned with relationships with other organizations that are involved in discovery, design and continual improvement of product?", a: ["Value streams and processes", "Information and technology", "Partners and suppliers", "Organizations and people"], c: 2 },
        { q: "According to the ‘focus on value’ ITIL Guiding Principle, all organizational activities should link back to what?", a: ["Benefits for organization, its customers, and stakeholders", "Increased revenue only", "Employee satisfaction", "Market share dominance"], c: 0 },
        { q: "According to the ITIL Guiding Principle ‘start where you are’, what is the MAIN risk of starting over without considering what is already available when improving a service?", a: ["Losing opportunities for collaboration and shared understanding across teams", "Overcomplicating solutions by ignoring practical, simple approaches", "Failing to gather feedback needed to guide gradual improvement", "Wasting time and losing valuable existing capabilities and resources"], c: 3 },
        { q: "What is the MAIN purpose of using feedback throughout improvement iterations?", a: ["To confirm that all stakeholder opinions are in agreement", "To ensure that improvement actions remain relevant and effective in changing circumstances", "To prevent the need for further adjustments once work has started", "To avoid changes in project priorities during implementation"], c: 1 },
        { q: "A design team is creating a new workflow and tries to account for every possible exception. What is the risk of designing the workflow in this way?", a: ["Achieving stronger overall risk control", "Creating unnecessary complexity", "Delivering outcomes more quickly and consistently", "Ensuring employees always follow processes without question"], c: 1 },
        { q: "Why should organizations consider the interaction of ITIL Guiding Principles?", a: ["Because principles are interdependent and complement each other", "Because one principle is always superior to the rest", "Because principles must be applied in a strict order", "Because one principle is usually sufficient for any situation"], c: 0 },
        { q: "What is the role of a governing body in an organization?", a: ["It is accountable for performance and compliance at the highest level", "It is responsible for day-to-day operations", "It manages the technical details of digital products directly", "It focuses exclusively on financial reporting"], c: 0 },
        { q: "Which of the following is NOT a success metric of the ‘discover’ activity?", a: ["Strategic fit of the organization’s products and service offerings", "Market relevance of the products and service offerings", "Service performance against the agreed SLA targets", "Stakeholder satisfaction with products and service offerings"], c: 2 },
        { q: "What is a digital service?", a: ["A service that fully or largely relies on digital products", "A combination of technology resources designed for consumers", "The transfer of goods from provider to consumer", "A catalogue of services for consumers"], c: 0 },
        { q: "Which term describes 'what an organization does for its consumers and other stakeholders and why'?", a: ["Value stream", "Value chain", "Operating model", "Organization’s purpose"], c: 3 },
        { q: "Which statement BEST explains the relationship between an organization’s purpose and its operating model?", a: ["The operating model defines the organization’s financial strategy to achieve its purpose", "The organization’s purpose determines why it exists, while the operating model shows how it fulfills that purpose", "The operating model replaces the organization’s purpose once the value chain is defined", "The purpose and operating model are unrelated because one focuses on customers and the other on internal processes"], c: 1 },
        { q: "Which of the following describes a management practice?", a: ["A series of steps that an organization uses to create and deliver products", "A set of organizational resources and capabilities designed to perform work or accomplish an objective", "A visual representation of how an organization co-creates value with stakeholders", "A set of interconnected activities that an organization performs to create and deliver products"], c: 1 },
        { q: "Which aspect of an ITIL Official Practice Guide describes the roles, competencies, and responsibilities needed for a specific practice?", a: ["Capability assessment and development", "General information", "Organizations and people", "Partners and suppliers"], c: 2 },
        { q: "A company plans an improvement initiative and ensures it is clearly linked to organizational goals and objectives. Which continual improvement step is being performed?", a: ["What is the vision?", "Where are we now?", "Take Action", "Where do we want to be?"], c: 0 },
        { q: "Which of the following is NOT one of the steps in value stream mapping?", a: ["Value stream identification", "Mapping of the ‘as-is’ value stream", "Mapping a ‘to-be’ value stream", "Value stream management"], c: 3 },
        { q: "What is a digital product?", a: ["A formal description of one or more services designed to address consumer needs", "The access to the service provider’s resources and their use according to the agreed terms and conditions", "A combination of an organization’s resources based on digital technology and designed to offer value to consumers", "Actions performed by a service provider or jointly by a service provider and consumer"], c: 2 },
        { q: "Which of the following is a key success metric for the ‘acquire’ activity?", a: ["Number and impact of incidents and performance deviations", "Quality of the resources and services outsourced from suppliers", "Service performance against the agreed SLA targets", "Negative impact of changes on service availability and performance"], c: 1 },
        { q: "Which BEST describes the relationship between digital services and digital products?", a: ["Digital products are always based on digital services", "Digital services are always based on digital products", "Digital services and digital products exist independently", "Digital products are service actions performed by providers"], c: 1 },
        { q: "Which role takes responsibility for the outcomes of service consumption?", a: ["Organization", "Sponsor", "Customer", "Service provider"], c: 2 },
        { q: "Which type of service relationship typically focuses on support and efficiency through standardized services?", a: ["Basic relationship", "Cooperative relationship", "Collaborative relationship", "Partner relationship"], c: 0 },
        { q: "Which statement about the ‘band of visibility’ is CORRECT?", a: ["It includes only the activities visible to the service provider", "It applies exclusively to modern, technology-based digital service models", "It represents all aspects visible between provider and consumer organizations", "It defines the complete path of the customer’s service journey"], c: 2 },
        { q: "What is the MAIN purpose of the 'discover' activity?", a: ["To develop and test digital products", "To secure and allocate resources efficiently", "To align product capabilities with consumer needs and strategy", "To maintain and monitor digital products"], c: 2 },
        { q: "Which lifecycle management activity is focused on creating prototypes and specifications?", a: ["Design", "Deliver", "Support", "Transition"], c: 0 },
        { q: "What is the PRIMARY purpose of the 'acquire' activity?", a: ["Resolve incidents and fulfil recovery procedures", "Secure and allocate necessary resources efficiently", "Provide services and manage user onboarding", "Create functional prototypes for testing"], c: 1 },
        { q: "Which lifecycle management activity focuses on minimizing the impact of incidents and disasters when they happen?", a: ["Transition", "Operate", "Support", "Design"], c: 2 },
        { q: "What does a product specification PRIMARILY describe?", a: ["Critical aspects, requirements, and characteristics of a product", "The initial creation used for testing a product’s design", "The ability of a system to remain operational", "The process of merging code into a central repository"], c: 0 },
        { q: "What is an incident in IT services?", a: ["Any change of state significant for management", "An unplanned interruption to a service or reduction in service quality", "A cause of one or more interruptions", "A flaw or vulnerability in a service"], c: 1 },
        { q: "How does ITIL collaborate with DevOps practices to support digital product and service management?", a: ["By providing the framework while DevOps supplies practices and techniques", "By replacing DevOps practices with standardized service management processes", "By limiting DevOps usage to software development activities", "By positioning DevOps as a governance framework over ITIL"], c: 0 },
        { q: "How is the ITIL AI Capability Model intended to be used by organizations?", a: ["To benchmark AI tools against predefined industry standards", "To assess readiness and identify areas for improvement in using AI", "To automate governance decisions across the ITIL Value System", "To prioritize AI investments based on financial return"], c: 1 },
        { q: "What BEST describes a Service Level Agreement (SLA)?", a: ["A legal contract between two vendors regulating financial penalties", "A documented agreement between a service provider and a customer that identifies services and their agreed levels", "An informal discussion between users and service providers about expectations", "A guideline document for internal IT teams without customer involvement"], c: 1 },
        { q: "Which ITIL concept includes governance, practices, and continual improvement?", a: ["The ITIL Value System", "The 'deliver' and 'support' value chain activities", "The 'focus on value' ITIL Guiding Principle", "The 'value streams and processes' dimension"], c: 0 },
        { q: "What is the MAIN purpose of value stream mapping in an organization?", a: ["To automate service monitoring", "To identify and prioritize improvement opportunities", "To enhance and support management practices", "To control external stakeholders directly"], c: 1 },
        { q: "What is the PRIMARY purpose of a product in ITIL product and service management?", a: ["To offer value to consumers through a defined configuration of resources", "To replace service management practices with product management", "To enable value co-creation by facilitating outcomes that customers want to achieve", "To ensure regulatory compliance across digital services"], c: 0 },
        { q: "What is the PRIMARY role of a digital service?", a: ["To define processes and workflows for value creation", "To enable value co-creation by facilitating customer outcomes", "To replace product management practices with service management", "To ensure compliance with policies and external regulations"], c: 1 },
        { q: "Which option is CORRECT in the context of a digital product and a digital service?", a: ["A digital service enables value through the use of digital products", "A digital product replaces the need for services", "A digital service is limited to internal IT systems", "A digital service is independent of a product"], c: 0 },
        { q: "A printer is delivered to a customer, while ongoing maintenance and support are provided by the supplier. Which combination of service interactions is shown in this situation?", a: ["Access to resources and service actions", "Service offering and service actions", "Transfer of goods and service actions", "Transfer of goods and service journey"], c: 2 },
        { q: "How does ‘access to resources’ support value co-creation in a service interaction?", a: ["By allowing consumers to use provider resources", "By transferring responsibility for resources to consumers", "By limiting resource use to internal teams", "By replacing service actions with automation"], c: 0 },
        { q: "Which of the following is TRUE about value co-creation?", a: ["Value is created only by the service provider and delivered to the consumer", "Value is defined and consumed by a service provider", "Value is created independently of service relationships", "Value is created jointly through interactions between service providers and service consumers"], c: 3 },
        { q: "How do ‘utility’ and ‘warranty’ together support value co-creation?", a: ["Utility focuses on cost control, while warranty focuses on risk avoidance", "Utility and warranty apply only to products, not services", "Utility ensures the service is fit for use, while warranty ensures it is fit for purpose", "Utility ensures the service is fit for purpose, while warranty ensures it is fit for use"], c: 3 },
        { q: "Why does ITIL consider outcomes, costs, and risks together when explaining value co-creation?", a: ["Because value is created when desired outcomes are achieved while costs and risks are optimized", "Because outcomes eliminate the need to manage costs and risks", "Because costs are more important than outcomes", "Because risks are more important than outcomes"], c: 0 },
        { q: "What does a service journey describe?", a: ["End-to-end interactions between a service provider and a service consumer", "The internal workflows and processes of a service provider", "The end-to-end lifecycle of a product", "The sequence of value chain activities"], c: 0 },
        { q: "Which role authorizes budget for a service in a service relationship?", a: ["Customer", "User", "Sponsor", "Product vendor"], c: 2 },
        { q: "What is service quality MOST concerned with?", a: ["How well a service meets agreed requirements and expectations", "How quickly incidents are resolved", "The speed of service development", "The social responsibility of a service provider"], c: 0 },
        { q: "Which of the following is typically used to establish a shared understanding of expected and achieved service quality?", a: ["Product specification", "Service Level Agreement", "Product and service roadmaps", "Service level requirements"], c: 1 },
        { q: "How does the ‘information and technology’ dimension support effective product and service management?", a: ["By enabling the use of data, information, and technology required to deliver services", "By defining organizational roles and responsibilities needed for product development", "By defining workflows and activities required for product development", "By managing relationships with external suppliers"], c: 0 },
        { q: "Which dimension is concerned with management of relationships with external organizations?", a: ["Partners and suppliers", "Information and technology", "Organizations and people", "Value streams and processes"], c: 0 },
        { q: "Why are ‘value streams and processes’ important in product and service management?", a: ["They specify the tools used for service monitoring", "They show how activities are coordinated to create and deliver value", "They define organizational hierarchies and reporting lines", "They describe supplier agreements and help manage contracts"], c: 1 },
        { q: "How does the ‘organizations and people’ dimension contribute to effective product and service management?", a: ["By ensuring skills, culture, and communication support value creation", "By defining the technologies used to deliver services", "By managing relationships with external organizations", "By automating workflows across value streams"], c: 0 },
        { q: "Which set CORRECTLY lists the components of the ITIL Value System?", a: ["Value streams, projects, releases, incidents, changes", "Guiding principles, governance, discover, deliver", "Products, services, customers, suppliers, partners", "Guiding principles, governance, value chain, management practices, continual improvement"], c: 3 },
        { q: "A team is developing a new digital service. Instead of delivering all features at once, they release a small set of features, gather user feedback, and adjust the next release based on what they learn. Which ITIL Guiding Principle is the team applying?", a: ["Keep it simple and practical", "Focus on value", "Progress iteratively with feedback", "Collaborate and promote visibility"], c: 2 },
        { q: "How should the ITIL Guiding Principle ‘optimize and automate’ be applied?", a: ["By replacing people with technology across all functions", "By optimizing processes before automating them", "By automating all activities immediately", "By automating processes before optimizing them"], c: 1 },
        { q: "What does the ITIL Guiding Principle ‘think and work holistically’ emphasize?", a: ["Considering all components of the value system when making decisions", "Assigning responsibility for improvements to a single team", "Ensuring all activities result in value creation for the stakeholders", "Automating repetitive and manual tasks"], c: 0 },
        { q: "How should the ITIL Guiding Principle ‘collaborate and promote visibility’ be applied?", a: ["By involving stakeholders and sharing information with them", "By limiting communication to management only", "By reusing existing processes wherever possible", "By capturing feedback after each iteration"], c: 0 },
        { q: "How does ITIL describe the way the Guiding Principles should be applied together?", a: ["They should be applied one at a time in a fixed sequence", "They replace the need for governance and management practices", "They should be applied independent of each other", "They should be used collectively and balanced based on the situation"], c: 3 },
        { q: "Which governance activity is focused on ensuring adherence with policies and strategic direction?", a: ["Evaluate", "Direct", "Monitor", "Discover"], c: 2 },
        { q: "Which of the following is a part of purpose of ‘deliver’ activity?", a: ["Managing user onboarding", "Monitoring support systems", "Designing product prototypes", "Obtaining supplier resources"], c: 0 },
        { q: "Which activity has the PRIMARY responsibility for maintaining and monitoring digital products and supporting systems?", a: ["Deliver", "Support", "Operate", "Transition"], c: 2 },
        { q: "Which activity ensures that new or changed products are seamlessly introduced in the live environment?", a: ["Build", "Transition", "Deliver", "Operate"], c: 1 },
        { q: "What is the purpose of the ‘support’ activity?", a: ["To assist users and maintain service performance", "To design service architectures", "To build solution components", "To discover new business opportunities"], c: 0 },
        { q: "What distinguishes ‘continuous deployment’ from ‘continuous delivery’?", a: ["Continuous deployment prevents frequent releases", "Continuous delivery requires manual code integration", "Continuous deployment automatically deploys changes to production", "Continuous delivery eliminates testing activities"], c: 2 },
        { q: "What refers to a detailed document outlining the requirements and characteristics of a product?", a: ["Change request", "Service request", "Product prototype", "Product specification"], c: 3 },
        { q: "What does observability enable in digital product and service management?", a: ["Understanding system behaviour through outputs such as logs, metrics, and traces", "Ensuring changes are approved before being deployed", "Automatically preventing incidents from occurring", "Improving service reliability through engineering practices"], c: 0 },
        { q: "What is a problem?", a: ["An unplanned service interruption", "Root cause of one or more incidents", "A service access request from users", "An incident that impacts critical services"], c: 1 },
        { q: "An organization wants to evaluate how well the ‘transition’ value chain activity is performing. Which metric would BEST support this?", a: ["Success rate of releases deployed into the live environment", "Number of ideas generated for new services", "Average cost per service request", "Percentage of value streams mapped"], c: 0 },
        { q: "Which metric is MOST appropriate for assessing the success of the ‘build’ value chain activity?", a: ["Number of incidents resolved within agreed targets", "Customer satisfaction score after service delivery", "Percentage of service requests fulfilled on first contact", "Quality of the product solutions"], c: 3 },
        { q: "How do value chain activities support an organization’s purpose?", a: ["By turning strategic intent into coordinated workflows that enable outcomes for stakeholders", "By defining governance controls and decision-making authority across management levels", "By standardizing operational procedures aligning them to the organization's purpose", "By setting predefined service quality targets to direct what the operational workflows should achieve"], c: 0 },
        { q: "Why are management practices important for value chain activities?", a: ["They define the organization’s purpose and strategy", "They enable value chain activities by providing the required capabilities", "They ensure activities are performed in a fixed order", "They replace value chain activities with standardized processes"], c: 1 },
        { q: "Why do ITIL Official Practice Guides follow a standardized structure across all practices?", a: ["To make it easier for organizations to understand and apply different practices", "To ensure all practices are implemented in the same sequence", "To enforce uniform tooling and technology choices", "To limit the flexibility of practice adoption"], c: 0 },
        { q: "How do ITIL Official Practice Guides benefit organizations managing digital products and services?", a: ["By prescribing mandatory tools and technologies for service management", "By separating product management guidance from service management guidance", "By supporting organizations in developing product and service management capabilities", "By defining a fixed maturity level that organizations must achieve"], c: 2 },
        { q: "Why does the ITIL Continual Improvement Model begin by defining the vision?", a: ["To document current performance metrics before changes are made", "To ensure improvement efforts are aligned with the organization’s objectives", "To identify improvement actions and assign responsibilities", "To confirm whether previous improvement initiatives were successful"], c: 1 },
        { q: "How does an enabling value stream contribute to value creation?", a: ["By supporting the effective operation of core value streams", "By replacing the need for core value streams", "By defining customer outcomes and service expectations", "By acting as the primary interface with service consumers"], c: 0 },
        { q: "What does ITIL emphasize as a key difference between ‘value stream mapping’ and ‘value stream management’?", a: ["Mapping identifies how value flows, while management ensures the value stream performs effectively over time", "Mapping is used only for reporting, while management is used only for auditing", "Mapping applies to services, while management applies to products", "Mapping focuses on cost control, while management focuses on risk avoidance"], c: 0 }
    ];

    let userSelections = new Array(questions.length).fill(null);
    let flaggedQuestions = new Array(questions.length).fill(false);
    let examEnded = false;

    const container = document.getElementById('exam-content');
    const navGrid = document.getElementById('nav-grid');
    const btnEnd = document.getElementById('btn-end-exam');

    function init() {
        questions.forEach((item, qIdx) => {
            const block = document.createElement('div');
            block.className = 'question-block';
            block.id = `q-block-${qIdx}`;
            block.innerHTML = `<div><strong>${qIdx + 1}.</strong> ${item.q}</div>`;

            const ul = document.createElement('ul');
            ul.className = 'options';
            item.a.forEach((opt, aIdx) => {
                const li = document.createElement('li');
                li.id = `q${qIdx}-o${aIdx}`;
                li.textContent = `${String.fromCharCode(65 + aIdx)}. ${opt}`;
                li.onclick = () => {
                    if (examEnded) return;
                    userSelections[qIdx] = aIdx;
                    block.querySelectorAll('li').forEach(el => el.classList.remove('selected'));
                    li.classList.add('selected');
                    document.getElementById(`nav-${qIdx}`).classList.add('nav-answered');
                };
                ul.appendChild(li);
            });
            block.appendChild(ul);

            const actions = document.createElement('div');
            actions.className = 'question-actions';

            const revealBtn = document.createElement('button');
            revealBtn.className = 'btn-small btn-reveal-styled';
            revealBtn.id = `btn-show-${qIdx}`;
            revealBtn.textContent = "Show Answer";
            revealBtn.onclick = () => toggleReveal(qIdx);

            const flagBtn = document.createElement('button');
            flagBtn.className = 'btn-small flag-btn-styled';
            flagBtn.textContent = "🏳️ Flag";
            flagBtn.onclick = () => {
                flaggedQuestions[qIdx] = !flaggedQuestions[qIdx];
                flagBtn.classList.toggle('active');
                flagBtn.textContent = flaggedQuestions[qIdx] ? "🚩 Flagged" : "🏳️ Flag";
                document.getElementById(`nav-${qIdx}`).classList.toggle('flagged-nav');
            };

            actions.appendChild(revealBtn);
            actions.appendChild(flagBtn);
            block.appendChild(actions);
            container.appendChild(block);

            const navItem = document.createElement('div');
            navItem.className = 'nav-item';
            navItem.id = `nav-${qIdx}`;
            navItem.textContent = qIdx + 1;
            navItem.onclick = () => block.scrollIntoView({ behavior: 'smooth' });
            navGrid.appendChild(navItem);
        });
    }

    function toggleReveal(idx) {
        const btn = document.getElementById(`btn-show-${idx}`);
        const opts = document.querySelectorAll(`#q-block-${idx} li`);
        if (btn.textContent === "Show Answer") {
            opts[questions[idx].c].classList.add('correct');
            if (userSelections[idx] !== null && userSelections[idx] !== questions[idx].c) {
                opts[userSelections[idx]].classList.add('wrong');
            }
            btn.textContent = "Hide Answer";
        } else {
            opts.forEach(o => o.classList.remove('correct', 'wrong'));
            btn.textContent = "Show Answer";
        }
    }

    btnEnd.onclick = () => {
        examEnded = true;
        let score = 0;
        questions.forEach((q, idx) => {
            const nav = document.getElementById(`nav-${idx}`);
            if (userSelections[idx] === q.c) {
                score++;
                nav.classList.add('nav-correct');
            } else {
                nav.classList.add('nav-wrong');
            }
            const btn = document.getElementById(`btn-show-${idx}`);
            if (btn.textContent === "Show Answer") toggleReveal(idx);
        });
        alert(`Exam Complete! Your Score: ${score}/${questions.length} (${Math.round(score/questions.length*100)}%)`);
    };

    setInterval(() => {
        document.getElementById('time-part').textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }, 1000);

    init();
})();
</script>
</body>
</html>
