<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITIL 4 Foundation Simulator</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --container-bg: #ffffff;
            --text-color: #333333;
            --border-color: #dddddd;
            --sidebar-bg: #2c3e50;
            --sidebar-text: #ffffff;
            --block-border: #eeeeee;
            --option-hover: #f0f7ff;
            --nav-bg: #ffffff;
            --primary: #3498db;
            --success: #2ecc71;
            --danger: #e74c3c;
            --warning: #e67e22; /* High-contrast Reset Color */
            --flagged: #f1c40f;
            
            /* Custom Action Colors */
            --btn-reveal-bg: #e8f8f1; /* Light green */
            --btn-flag-bg: #fff8e1;   /* Yellow-orange light */
            --action-text: #333333;
        }

        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); margin: 0; display: flex; min-height: 100vh; }
        
        #sidebar { 
            position: sticky; top: 0; width: 260px; height: 100vh; 
            background: var(--sidebar-bg); padding: 20px; box-sizing: border-box; 
            display: flex; flex-direction: column; gap: 15px; z-index: 100; 
        }

        main { flex-grow: 1; display: flex; justify-content: center; padding: 20px; }

        .container { 
            width: 100%; max-width: 850px; background: var(--container-bg); 
            padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); 
            box-sizing: border-box; 
        }

        h1 { text-align: center; color: var(--primary); border-bottom: 2px solid var(--primary); padding-bottom: 15px; margin-top: 0; }
        
        .question-block { margin-bottom: 30px; padding: 25px; border-bottom: 1px solid var(--block-border); scroll-margin-top: 20px; }
        
        .question-actions { display: flex; gap: 10px; margin-top: 20px; align-items: center; }

        .btn-small { 
            padding: 6px 12px; font-size: 12px; cursor: pointer; 
            border: 1px solid var(--border-color); border-radius: 4px; 
            font-weight: bold; transition: 0.2s; color: var(--action-text); 
        }

        .btn-reveal-styled { background-color: var(--btn-reveal-bg); }
        .flag-btn-styled { background-color: var(--btn-flag-bg); }
        .flag-btn-styled.active { background-color: var(--flagged); border-color: var(--flagged); }

        .options { list-style: none; padding: 0; margin-top: 15px; }
        .options li { 
            margin: 10px 0; padding: 15px; border: 1px solid var(--border-color); 
            border-radius: 6px; cursor: pointer; transition: 0.2s; background: var(--container-bg); 
        }
        .options li:hover { background-color: var(--option-hover); }
        .options li.selected { border-color: var(--primary); border-width: 2px; background-color: #3498db22; }
        
        .correct { background-color: #2ecc7133 !important; color: var(--success) !important; border-color: var(--success) !important; font-weight: bold; }
        .wrong { background-color: #e74c3c33 !important; color: var(--danger) !important; border-color: var(--danger) !important; }

        #nav-panel { background: var(--nav-bg); border-radius: 8px; padding: 12px; overflow-y: auto; flex-grow: 1; }
        .nav-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(38px, 1fr)); gap: 6px; }
        .nav-item { 
            padding: 10px 0; text-align: center; border: 1px solid var(--border-color); 
            border-radius: 4px; cursor: pointer; font-size: 12px; background: var(--container-bg); 
            color: var(--text-color); font-weight: bold; position: relative;
        }
        .nav-item.flagged-nav::after {
            content: ""; position: absolute; top: 2px; right: 2px;
            width: 8px; height: 8px; background-color: var(--flagged); border-radius: 50%;
        }
        .nav-answered { border-color: var(--primary); background: #3498db22; }
        .nav-correct { background-color: var(--success) !important; color: white !important; }
        .nav-wrong { background-color: var(--danger) !important; color: white !important; }

        .action-btn { padding: 12px; font-size: 14px; cursor: pointer; border: none; border-radius: 8px; font-weight: bold; width: 100%; transition: opacity 0.2s; }
        .btn-end { background-color: var(--success); color: white; }
        .btn-reset { background-color: var(--warning); color: white; margin-top: 5px; }
        .action-btn:hover { opacity: 0.9; }
    </style>
</head>
<body>

<aside id="sidebar">
    <div style="text-align: center; color: white; padding-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.1);">
        <div id="time-part" style="font-size: 1.6rem; color: #3498db; font-weight: bold; margin-bottom: 5px;"></div>
        <a href="index.html" style="color: #ecf0f1; text-decoration: none; font-size: 11px; opacity: 0.8;">← Return to Portal</a>
    </div>
    <div id="nav-panel">
        <div class="nav-grid" id="nav-grid"></div>
    </div>
    <button id="btn-end-exam" class="action-btn btn-end">End Exam</button>
    <button id="btn-reset-exam" class="action-btn btn-reset">Reset All</button>
</aside>

<main>
    <div class="container">
        <h1>ITIL 4 Foundation Simulator</h1>
        <div id="exam-content"></div>
    </div>
</main>

<script>
(function() {
    "use strict";

    const questions = [
        { q: "Which concept is illustrated when an employee is granted permission to the company’s new file-sharing platform for daily use?", a: ["Warranty", "Goods", "Utility", "Access to resources"], c: 3 },
        { q: "An IT support engineer assisting a user in configuring their laptop is an example of which concept?", a: ["Transfer of goods", "Service actions", "Sustainability", "Access to resources"], c: 1 },
        { q: "What influences whether a service is perceived as valuable by a consumer?", a: ["The service provider’s ability to minimize their operational costs", "The number of providers delivering the service to the consumer", "The extent to which the positive effects of the service outweigh the negative ones", "The amount of money the service provider invests in resources"], c: 2 },
        { q: "Which of the following is TRUE regarding services and desired outcomes?", a: ["Services guarantee that all intended outcomes will be achieved", "Services completely eliminate risks associated with achieving outcomes", "Services always result in positive effects without exceptions", "Services may have unintended and surprising outcomes, both positive and negative"], c: 3 },
        { q: "A service provider commits to using recyclable components, reducing carbon emissions, and maintaining transparent supply chains. Which concept does this commitment represent?", a: ["Utility", "Warranty", "User experience", "Sustainability"], c: 3 },
        { q: "Which dimension of product and service management is directly influenced by leadership commitment to psychological safety and continual learning?", a: ["Partners and suppliers", "Value streams and processes", "Information and technology", "Organizations and people"], c: 3 },
        { q: "Which of the following dimension of product and service management addresses organizational and cross-organizational workflows?", a: ["Partners and suppliers", "Information and technology", "Organizations and people", "Value streams and processes"], c: 3 },
        { q: "Which dimension of product and service management addresses data and technologies used in digital product and services?", a: ["Partners and suppliers", "Value streams and processes", "Organizations and people", "Information and technology"], c: 3 },
        { q: "Which dimension of product and service management is concerned with relationships with other organizations that are involved in discovery, design and continual improvement of product?", a: ["Value streams and processes", "Information and technology", "Partners and suppliers", "Organizations and people"], c: 2 },
        { q: "According to the ‘focus on value’ ITIL Guiding Principle, all organizational activities should link back to what?", a: ["Benefits for organization, its customers, and stakeholders", "Increased revenue only", "Employee satisfaction", "Market share dominance"], c: 0 },
        { q: "According to the ITIL Guiding Principle ‘start where you are’, what is the MAIN risk of starting over without considering what is already available when improving a service?", a: ["Losing opportunities for collaboration and shared understanding across teams", "Overcomplicating solutions by ignoring practical, simple approaches", "Failing to gather feedback needed to guide gradual improvement", "Wasting time and losing valuable existing capabilities and resources"], c: 3 },
        { q: "What is the MAIN purpose of using feedback throughout improvement iterations?", a: ["To confirm that all stakeholder opinions are in agreement", "To ensure that improvement actions remain relevant and effective in changing circumstances", "To prevent the need for further adjustments once work has started", "To avoid changes in project priorities during implementation"], c: 1 },
        { q: "A design team is creating a new workflow and tries to account for every possible exception. What is the risk of designing the workflow in this way?", a: ["Achieving stronger overall risk control", "Creating unnecessary complexity", "Delivering outcomes more quickly and consistently", "Ensuring employees always follow processes without question"], c: 1 },
        { q: "Why should organizations consider the interaction of ITIL Guiding Principles?", a: ["Because principles are interdependent and complement each other", "Because one principle is always superior to the rest", "Because principles must be applied in a strict order", "Because one principle is usually sufficient for any situation"], c: 0 },
        { q: "What is the role of a governing body in an organization?", a: ["It is accountable for performance and compliance at the highest level", "It is responsible for day-to-day operations", "It manages the technical details of digital products directly", "It focuses exclusively on financial reporting"], c: 0 },
        { q: "Which of the following is NOT a success metric of the ‘discover’ activity?", a: ["Strategic fit of the organization’s products and service offerings", "Market relevance of the products and service offerings", "Service performance against the agreed SLA targets", "Stakeholder satisfaction with products and service offerings"], c: 2 },
        { q: "What is a digital service?", a: ["A service that fully or largely relies on digital products", "A combination of technology resources designed for consumers", "The transfer of goods from provider to consumer", "A catalogue of services for consumers"], c: 0 },
        { q: "Which term describes 'what an organization does for its consumers and other stakeholders and why'?", a: ["Value stream", "Value chain", "Operating model", "Organization’s purpose"], c: 3 },
        { q: "Which statement BEST explains the relationship between an organization’s purpose and its operating model?", a: ["The operating model defines the organization’s financial strategy to achieve its purpose", "The organization’s purpose determines why it exists, while the operating model shows how it fulfills that purpose", "The operating model replaces the organization’s purpose once the value chain is defined", "The purpose and operating model are unrelated because one focuses on customers and the other on internal processes"], c: 1 },
        { q: "Which of the following describes a management practice?", a: ["A series of steps that an organization uses to create and deliver products", "A set of organizational resources and capabilities designed to perform work or accomplish an objective", "A visual representation of how an organization co-creates value with stakeholders", "A set of interconnected activities that an organization performs to create and deliver products"], c: 1 },
        { q: "Which aspect of an ITIL Official Practice Guide describes the roles, competencies, and responsibilities needed for a specific practice?", a: ["Capability assessment and development", "General information", "Organizations and people", "Partners and suppliers"], c: 2 },
        { q: "A company plans an improvement initiative and ensures it is clearly linked to organizational goals and objectives. Which continual improvement step is being performed?", a: ["What is the vision?", "Where are we now?", "Take Action", "Where do we want to be?"], c: 0 },
        { q: "Which of the following is NOT one of the steps in value stream mapping?", a: ["Value stream identification", "Mapping of the ‘as-is’ value stream", "Mapping a ‘to-be’ value stream", "Value stream management"], c: 3 },
        { q: "What is a digital product?", a: ["A formal description of one or more services designed to address consumer needs", "The access to the service provider’s resources and their use according to the agreed terms and conditions", "A combination of an organization’s resources based on digital technology and designed to offer value to consumers", "Service actions performed by a provider"], c: 2 },
        { q: "Which of the following is a key success metric for the ‘acquire’ activity?", a: ["Number and impact of incidents", "Quality of outsourced resources", "Performance against SLAs", "Negative impact of changes"], c: 1 },
        { q: "Which relationship is TRUE?", a: ["Products based on services", "Services based on products", "They are independent", "Products are service actions"], c: 1 },
        { q: "Which role takes responsibility for outcomes of consumption?", a: ["Organization", "Sponsor", "Customer", "Provider"], c: 2 },
        { q: "Which relationship focuses on efficiency?", a: ["Basic", "Cooperative", "Collaborative", "Partner"], c: 0 },
        { q: "What is the ‘band of visibility’?", a: ["Provider only", "Modern models only", "Visible aspects between provider/consumer", "Customer journey path"], c: 2 },
        { q: "Purpose of 'discover' activity?", a: ["Develop prototypes", "Secure resources", "Align capabilities with strategy", "Monitor products"], c: 2 },
        { q: "Which activity creates prototypes?", a: ["Design", "Deliver", "Support", "Transition"], c: 0 },
        { q: "Purpose of 'acquire' activity?", a: ["Resolve incidents", "Secure resources efficiently", "Onboard users", "Test prototypes"], c: 1 },
        { q: "Activity that minimizes incident impact?", a: ["Transition", "Operate", "Support", "Design"], c: 2 },
        { q: "What does a product specification describe?", a: ["Characteristics and requirements", "Initial creation for testing", "System ability to remain operational", "Process of merging code"], c: 0 },
        { q: "What is an incident?", a: ["Significant change of state", "Unplanned interruption", "Root cause of interruptions", "Flaw or vulnerability"], c: 1 },
        { q: "ITIL and DevOps?", a: ["ITIL framework, DevOps techniques", "ITIL replaces DevOps", "DevOps limited to software", "DevOps governs ITIL"], c: 0 },
        { q: "How to use ITIL AI Capability Model?", a: ["Benchmark tools", "Assess readiness", "Automate governance", "Prioritize investments"], c: 1 },
        { q: "What is an SLA?", a: ["Legal vendor contract", "Agreement between provider and customer", "Informal discussion", "Internal IT guideline"], c: 1 },
        { q: "ITIL concept including governance?", a: ["ITIL Value System", "Deliver/Support chain", "Focus on value", "Value streams dimension"], c: 0 },
        { q: "Purpose of value stream mapping?", a: ["Automate monitoring", "Identify improvement opportunities", "Support practices", "Control stakeholders"], c: 1 },
        { q: "Purpose of a product?", a: ["Offer value through configuration of resources", "Replace practices", "Enable co-creation", "Ensure compliance"], c: 0 },
        { q: "Role of a digital service?", a: ["Define workflows", "Facilitate customer outcomes", "Replace product management", "Ensure compliance"], c: 1 },
        { q: "Correct context of product/service?", a: ["Service enables value via products", "Product replaces services", "Service is limited to IT", "Service is independent"], c: 0 },
        { q: "Situation: Printer delivery + maintenance?", a: ["Access + Actions", "Offering + Actions", "Goods + Actions", "Goods + Journey"], c: 2 },
        { q: "How 'access' supports co-creation?", a: ["Allow consumers to use resources", "Transfer responsibility", "Limit to internal teams", "Replace actions with automation"], c: 0 },
        { q: "Value co-creation truth?", a: ["Created only by provider", "Consumed by provider", "Independent of relationship", "Joint interactions"], c: 3 },
        { q: "Utility and Warranty together?", a: ["Cost vs Risk", "Products only", "Fit for use vs Fit for purpose", "Fit for purpose vs Fit for use"], c: 3 },
        { q: "Why consider outcomes, costs, risks?", a: ["Value is created when optimized", "Outcomes eliminate management", "Costs > Outcomes", "Risks > Outcomes"], c: 0 },
        { q: "What is a service journey?", a: ["End-to-end interactions", "Internal workflows", "Product lifecycle", "Value chain sequence"], c: 0 },
        { q: "Who authorizes budget?", a: ["Customer", "User", "Sponsor", "Vendor"], c: 2 },
        { q: "Service quality concern?", a: ["Meeting requirements", "Resolution speed", "Development speed", "Social responsibility"], c: 0 },
        { q: "Established shared understanding?", a: ["Specification", "SLA", "Roadmaps", "Requirements"], c: 1 },
        { q: "Information and Tech dimension?", a: ["Enable data use", "Define roles", "Define workflows", "Manage suppliers"], c: 0 },
        { q: "Dimension concerned with external orgs?", a: ["Partners and suppliers", "Info and Tech", "People", "Processes"], c: 0 },
        { q: "Why 'value streams and processes'?", a: ["Specify tools", "Coordinate activities for value", "Define hierarchies", "Manage contracts"], c: 1 },
        { q: "Organizations and people dimension?", a: ["Skills, culture, communication", "Define tech", "Manage orgs", "Automate workflows"], c: 0 },
        { q: "Components of ITIL Value System?", a: ["Streams, projects", "Principles, governance, chain, practices, improvement", "Products, services", "Principles, governance, discover"], c: 1 },
        { q: "Iterative releases + feedback?", a: ["Simple/Practical", "Focus on value", "Progress iteratively", "Collaborate"], c: 2 },
        { q: "Optimize and Automate?", a: ["Replace people", "Optimize before automate", "Automate immediately", "Automate before optimize"], c: 1 },
        { q: "Think/Work Holistically?", a: ["Consider all components", "Single team responsibility", "Result in value", "Automate tasks"], c: 0 },
        { q: "Collaborate and Promote Visibility?", a: ["Involve stakeholders", "Management only", "Reuse processes", "Capture feedback"], c: 0 },
        { q: "How to apply principles together?", a: ["One at a time", "Replace governance", "Independent", "Collectively and balanced"], c: 3 },
        { q: "Activity for policy adherence?", a: ["Evaluate", "Direct", "Monitor", "Discover"], c: 2 },
        { q: "Purpose of 'deliver' activity?", a: ["Manage onboarding", "Monitor support", "Design prototypes", "Obtain resources"], c: 0 },
        { q: "Primary for monitoring products?", a: ["Deliver", "Support", "Operate", "Transition"], c: 2 },
        { q: "Introduce changes to live?", a: ["Build", "Transition", "Deliver", "Operate"], c: 1 },
        { q: "Purpose of 'support' activity?", a: ["Assist users/performance", "Design architecture", "Build components", "Discover opportunities"], c: 0 },
        { q: "Deployment vs Delivery?", a: ["Prevent releases", "Manual integration", "Automatic deployment", "Eliminate testing"], c: 2 },
        { q: "Document for characteristics?", a: ["Change", "Request", "Prototype", "Specification"], c: 3 },
        { q: "Observability enables?", a: ["Understand behavior via logs", "Approval before deploy", "Prevent incidents", "Improve reliability"], c: 0 },
        { q: "What is a problem?", a: ["Unplanned interruption", "Root cause of incidents", "Access request", "Critical impact"], c: 1 },
        { q: "Metric for 'transition'?", a: ["Release success rate", "Generated ideas", "Request cost", "Streams mapped"], c: 0 },
        { q: "Metric for 'build'?", a: ["Resolved incidents", "CSAT", "First contact resolution", "Quality of solutions"], c: 3 },
        { q: "How chain activities support purpose?", a: ["Strategic intent to workflows", "Define controls", "Standardize procedures", "Set quality targets"], c: 0 },
        { q: "Management practices importance?", a: ["Define strategy", "Provide capabilities", "Fixed order", "Replace activities"], c: 1 },
        { q: "Standardized structure benefits?", a: ["Easy to understand", "Same sequence", "Enforce tech", "Limit flexibility"], c: 0 },
        { q: "Practice guide benefit?", a: ["Mandatory tools", "Separate guidance", "Develop capabilities", "Fixed maturity"], c: 2 },
        { q: "Start with vision?", a: ["Document metrics", "Align with objectives", "Assign responsibility", "Confirm success"], c: 1 },
        { q: "Enabling value stream?", a: ["Support core streams", "Replace core", "Define outcomes", "Primary interface"], c: 0 },
        { q: "Mapping vs Management?", a: ["Flow vs Performance", "Reporting vs Auditing", "Services vs Products", "Cost vs Risk"], c: 0 }
    ];

    const container = document.getElementById('exam-content');
    const navGrid = document.getElementById('nav-grid');
    const btnEnd = document.getElementById('btn-end-exam');
    const btnReset = document.getElementById('btn-reset-exam');
    
    let userSelections = new Array(questions.length).fill(null);
    let flaggedQuestions = new Array(questions.length).fill(false);
    let examEnded = false;

    function init() {
        container.innerHTML = ""; navGrid.innerHTML = "";
        questions.forEach((item, qIdx) => {
            const block = document.createElement('div');
            block.className = 'question-block';
            block.id = `q-block-${qIdx}`;
            block.innerHTML = `<div><strong>${qIdx + 1}.</strong> ${item.q}</div>`;

            const ul = document.createElement('ul');
            ul.className = 'options';
            item.a.forEach((opt, aIdx) => {
                const li = document.createElement('li');
                li.id = `q${qIdx}-o${aIdx}`;
                li.textContent = `${String.fromCharCode(65 + aIdx)}. ${opt}`;
                li.onclick = () => {
                    if (examEnded) return;
                    userSelections[qIdx] = aIdx;
                    block.querySelectorAll('li').forEach(el => el.classList.remove('selected'));
                    li.classList.add('selected');
                    document.getElementById(`nav-${qIdx}`).classList.add('nav-answered');
                };
                ul.appendChild(li);
            });
            block.appendChild(ul);

            const actions = document.createElement('div');
            actions.className = 'question-actions';
            const revealBtn = document.createElement('button');
            revealBtn.className = 'btn-small btn-reveal-styled';
            revealBtn.textContent = "Show Answer";
            revealBtn.onclick = () => toggleReveal(qIdx);

            const flagBtn = document.createElement('button');
            flagBtn.className = 'btn-small flag-btn-styled';
            flagBtn.textContent = flaggedQuestions[qIdx] ? "🚩 Flagged" : "🏳️ Flag";
            if (flaggedQuestions[qIdx]) flagBtn.classList.add('active');
            
            flagBtn.onclick = () => {
                flaggedQuestions[qIdx] = !flaggedQuestions[qIdx];
                flagBtn.classList.toggle('active');
                flagBtn.textContent = flaggedQuestions[qIdx] ? "🚩 Flagged" : "🏳️ Flag";
                document.getElementById(`nav-${qIdx}`).classList.toggle('flagged-nav');
            };

            actions.appendChild(revealBtn); actions.appendChild(flagBtn);
            block.appendChild(actions); container.appendChild(block);

            const navItem = document.createElement('div');
            navItem.className = 'nav-item'; navItem.id = `nav-${qIdx}`;
            if (flaggedQuestions[qIdx]) navItem.classList.add('flagged-nav');
            if (userSelections[qIdx] !== null) navItem.classList.add('nav-answered');
            navItem.textContent = qIdx + 1;
            navItem.onclick = () => block.scrollIntoView({ behavior: 'smooth' });
            navGrid.appendChild(navItem);
        });
    }

    function toggleReveal(idx) {
        const btn = document.getElementById(`btn-show-${idx}`);
        const opts = document.querySelectorAll(`#q-block-${idx} li`);
        if (btn.textContent === "Show Answer") {
            opts[questions[idx].c].classList.add('correct');
            if (userSelections[idx] !== null && userSelections[idx] !== questions[idx].c) {
                opts[userSelections[idx]].classList.add('wrong');
            }
            btn.textContent = "Hide Answer";
        } else {
            opts.forEach(o => o.classList.remove('correct', 'wrong'));
            btn.textContent = "Show Answer";
        }
    }

    btnEnd.onclick = () => {
        if(confirm("Are you sure you want to end the exam? All answers will be revealed.")) {
            examEnded = true;
            let score = 0;
            questions.forEach((q, idx) => {
                const nav = document.getElementById(`nav-${idx}`);
                if (userSelections[idx] === q.c) {
                    score++;
                    nav.classList.add('nav-correct');
                } else {
                    nav.classList.add('nav-wrong');
                }
                const btn = document.getElementById(`btn-show-${idx}`);
                if (btn.textContent === "Show Answer") toggleReveal(idx);
            });
            alert(`Exam Complete! Score: ${score}/${questions.length} (${Math.round(score/questions.length*100)}%)`);
        }
    };

    btnReset.onclick = () => {
        if(confirm("WARNING: Are you sure you want to reset all progress? All flags and answers will be cleared.")) {
            userSelections.fill(null);
            flaggedQuestions.fill(false);
            examEnded = false;
            init();
            window.scrollTo(0,0);
        }
    };

    setInterval(() => {
        document.getElementById('time-part').textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }, 1000);

    init();
})();
</script>
</body>
</html>
